name: Test container hook

on:
  push:
    paths:
      - '.AL-Go/NewBcContainer.ps1'
      - '.AL-Go/tests/**'
      - '.github/workflows/TestContainerHook.yaml'
  pull_request:
    paths:
      - '.AL-Go/NewBcContainer.ps1'
      - '.AL-Go/tests/**'
      - '.github/workflows/TestContainerHook.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run container hook regression tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path .AL-Go/tests -Output Detailed -CI
